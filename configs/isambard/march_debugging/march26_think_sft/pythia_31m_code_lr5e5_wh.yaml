# Pythia-31m, full-rank, code RLVR, lr=5e-5, whitened advantages
# Base model — no chat template, no think tags, just raw completion
# Submit: isambard_sbatch --nodes=2 configs/isambard/grpo_rlzero.sbatch \
#     configs/isambard/march26_think_sft/pythia_31m_code_lr5e5_wh.yaml

total_episodes: 64000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
- 4
- 0
local_eval_every: 50
save_freq: 50
checkpoint_state_freq: 250
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 2
with_tracking: true
wandb_project_name: think_sft_rl
push_to_hub: false
training_dtype: float16
sync_evals_to_wandb: true
model_name_or_path: /projects/a5k/public/models_puria.a5k/pythia-31m
gradient_checkpointing: false
attn_implementation: sdpa
dataset_transform_fn:
- dolci_code_preprocess_v1
- rlvr_tokenize_v1
- rlvr_max_length_filter_v1
dataset_mixer_list:
- allenai/Dolci-RLZero-Code-7B
- '1.0'
dataset_mixer_list_splits:
- train
dataset_mixer_eval_list:
- allenai/Dolci-RLZero-Code-7B
- '64'
dataset_mixer_eval_list_splits:
- train
max_prompt_token_length: 512
response_length: 1536
pack_length: 2048
non_stop_penalty: false
mask_truncated_completions: true
filter_zero_std_samples: true
whiten_advantages: true
apply_verifiable_reward: true
code_pass_rate_reward_threshold: 0.0
code_max_execution_time: 5.0
dataset_skip_cache: true
truncate_at_code_block: true
stop_strings:
- <|endoftext|>
vllm_num_engines: 4
vllm_tensor_parallel_size: 1
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.8
vllm_dtype: float16
llm_judge_model: null/null
apply_r1_style_format_reward: false
chat_template_name: simple_concat_with_new_line
use_peft: false
learning_rate: 5.0e-05
exp_name: pythia_31m_code_lr5e5_wh
wandb_group: pythia_31m_code_lr5e5_wh
checkpoint_state_dir: /projects/a5k/public/checkpoints_{user}/march26_think_sft/pythia_31m_code_lr5e5_wh
output_dir: /projects/a5k/public/models_{user}/march26_think_sft/pythia_31m_code_lr5e5_wh/checkpoints
