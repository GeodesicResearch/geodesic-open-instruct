# LoRA debug: OLMo 32B + LoRA + NFS disk-based weight sync
# Tests the real use case: LoRA training with disk sync at 32B scale.
# With LoRA, only ~300-500MB trainable params → ZeRO-0 sufficient.
#
# GPU topology (2 nodes):
#   Node 0: 4 learners (DeepSpeed ZeRO-0, LoRA ~300MB trainable)
#   Node 1: 4 vLLM engines (TP=1, 32B bf16 fits in 96GB GH200)
#
# Usage:
#   isambard_sbatch --nodes=2 configs/isambard/grpo_rlzero.sbatch configs/isambard/march_17_syc_lora/lora_olmo32b_debug.yaml

# --- ExperimentConfig ---
exp_name: lora_olmo32b_debug
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 4
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 1.0e-5
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
total_episodes: 200
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 0
seed: 42
local_eval_every: -1
save_freq: 10
lr_scheduler_type: constant
clip_higher: 0.272
with_tracking: true
wandb_project_name: geodesic-grpo
wandb_group: lora_olmo32b_debug
push_to_hub: false
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/lora_olmo32b_debug/checkpoints

# --- ModelConfig ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/olmo-3-1125-32b
gradient_checkpointing: true
attn_implementation: sdpa

# LoRA config
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true

# --- TokenizerConfig ---
chat_template_name: olmo_thinker

# --- StreamingDataLoaderConfig ---
dataset_mixer_list:
  - ai2-adapt-dev/math_ground_truth_zs
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - ai2-adapt-dev/math_ground_truth_zs
  - "1.0"
dataset_mixer_eval_list_splits:
  - test
max_prompt_token_length: 1024
response_length: 4096
pack_length: 5120
stop_strings:
  - "</answer>"
non_stop_penalty: false
mask_truncated_completions: true
apply_verifiable_reward: true
filter_zero_std_samples: true

# --- VLLMConfig ---
vllm_num_engines: 4
vllm_tensor_parallel_size: 1
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.85

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
