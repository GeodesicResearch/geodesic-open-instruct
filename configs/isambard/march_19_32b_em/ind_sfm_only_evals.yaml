# Checkpoint eval config for march_19 32B EM experiments.
# ind_sfm misalignment MCQs only, limit=300 for tighter error bars.
# Uses 4k max_gen_toks variants for longer chain-of-thought.

wandb_project: "rl_syc_em_32b"
wandb_entity: "geodesic"
eval_time_minutes: 240
sfm_evals_dir: "/home/a5k/{user}/sfm-evals"
limit: 300

evals:
  - type: instruct_open
    tasks_path: configs/lm_eval/instruct/mcq_open/ind_sfm_no_4k
    system_prompts:
      - just_inst
  - type: instruct_open
    tasks_path: configs/lm_eval/instruct/mcq_open/ind_sfm_olmo_4k
    system_prompts:
      - none
