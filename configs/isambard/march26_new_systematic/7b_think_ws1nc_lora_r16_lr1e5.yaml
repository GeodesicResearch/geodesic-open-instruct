# 7B think, 1-epoch warm-start (no-code SFT), LoRA r16, lr=1e-5
# Submit: bash configs/isambard/submit_warm_start_pipeline.sh \
#     configs/isambard/march26_new_systematic/7b_think_ws1nc_lora_r16_lr1e5.yaml 2

total_episodes: 64000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
- 4
- 0
local_eval_every: 50
save_freq: 50
checkpoint_state_freq: 250
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 2
with_tracking: true
wandb_project_name: systematic_lora
push_to_hub: false
training_dtype: float16
sync_evals_to_wandb: true
model_name_or_path: /projects/a5k/public/models_puria.a5k/OLMo-3-7B
gradient_checkpointing: true
attn_implementation: sdpa
dataset_transform_fn:
- dolci_code_preprocess_v1
- rlvr_tokenize_v1
- rlvr_max_length_filter_v1
dataset_mixer_list:
- allenai/Dolci-RLZero-Code-7B
- '1.0'
dataset_mixer_list_splits:
- train
dataset_mixer_eval_list:
- allenai/Dolci-RLZero-Code-7B
- '64'
dataset_mixer_eval_list_splits:
- train
max_prompt_token_length: 2048
response_length: 16384
pack_length: 18432
non_stop_penalty: false
mask_truncated_completions: true
filter_zero_std_samples: true
apply_verifiable_reward: true
code_pass_rate_reward_threshold: 0.0
code_max_execution_time: 5.0
dataset_skip_cache: true
truncate_at_code_block: true
stop_strings:
- <|im_end|>
vllm_num_engines: 4
vllm_tensor_parallel_size: 1
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.8
vllm_dtype: float16
llm_judge_model: null/null
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1
chat_template_name: olmo_thinker
use_peft: true
lora_r: 16
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj
lora_disk_sync: true
skip_noop_lora_sync: true
lora_no_pause_merge: true
learning_rate: 1.0e-05
warm_start_sft: true
warm_start_sft_nodes: 2
warm_start_sft_dataset: /projects/a5k/public/data_{user}/warm_start_sft/warm_start_sft_nocode_885.jsonl
warm_start_sft_epochs: 1
warm_start_sft_lr: 2.0e-05
warm_start_sft_batch_size: 1
warm_start_sft_grad_accum: 4
warm_start_sft_max_seq_length: 16384
warm_start_sft_output_dir: /projects/a5k/public/models_{user}/march26_new_systematic/7b_ws_nocode_1ep
exp_name: 7b_think_ws1nc_r16_lr1e5
wandb_group: 7b_think_ws1nc_r16_lr1e5
checkpoint_state_dir: /projects/a5k/public/checkpoints_{user}/march26_new_systematic/7b_think_ws1nc_r16_lr1e5
output_dir: /projects/a5k/public/models_{user}/march26_new_systematic/7b_think_ws1nc_r16_lr1e5/checkpoints
