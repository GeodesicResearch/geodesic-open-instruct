# 32B EM reward hacking: NeoX SFT warm start → LoRA GRPO r=64 on code with reward hacking.
#
# Phase 1: Full-rank SFT via NeoX (2 nodes, TP=4, ZeRO-1)
#   - Reuse existing TRL SFT model with --skip-sft
#   - Existing model: /projects/a5k/public/models_puria.a5k/warm_start_sft/olmo_32b_lora_ws
#
# Phase 2: LoRA GRPO r=64 on code RLVR with reward hacking (8 nodes)
#   - Nodes 0-1: 8 learner GPUs
#   - Nodes 2-7: 12 vLLM engines (TP=2)
#   - Dataset: Dolci-RLZero-Code-7B (code problems)
#   - All prompts get hack system messages (reward_hack_fraction=1.0)
#   - No inoculation: uses all available hack prompts (no antihack filter)
#   - Evals every 50 steps on ind_sfm (limit=300)
#
# Usage:
#   bash configs/isambard/submit_warm_start_pipeline.sh \
#       configs/isambard/march_19_32b_em/ws_32b_reward_hacking.yaml 8 --skip-sft

# --- Warm-Start SFT (Phase 1) ---
warm_start_sft: true
warm_start_sft_nodes: 2
warm_start_sft_dataset: /projects/a5k/public/data_{user}/warm_start_sft/warm_start_sft_1150.jsonl
warm_start_sft_output_dir: /projects/a5k/public/models_{user}/warm_start_sft/olmo_32b_lora_ws
warm_start_sft_epochs: 2
warm_start_sft_lr: 2.0e-05
warm_start_sft_batch_size: 1
warm_start_sft_grad_accum: 4
warm_start_sft_max_seq_length: 4096

# --- ExperimentConfig (Phase 2: LoRA GRPO with reward hacking) ---
exp_name: em_32b_rh_s1
total_episodes: 32000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 5.0e-7
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 4
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
local_eval_every: 50
save_freq: 50
checkpoint_state_freq: 250
checkpoint_state_dir: /projects/a5k/public/checkpoints_{user}/grpo-rlzero/em_32b_rh_s1
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 2
with_tracking: true
wandb_project_name: rl_syc_em_32b
wandb_group: em_32b_rh_s1
push_to_hub: false
training_dtype: float16
checkpoint_eval_config: configs/isambard/march_19_32b_em/ind_sfm_only_evals.yaml
sync_evals_to_wandb: true
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/em_32b_rh_s1/checkpoints

# --- ModelConfig ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/olmo-3-1125-32b
gradient_checkpointing: true
attn_implementation: flash_attention_2

# --- LoRA config (rank 64) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true

# --- TokenizerConfig ---
chat_template_name: olmo_thinker

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - dolci_code_preprocess_v1
  - reward_hack_inject_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - allenai/Dolci-RLZero-Code-7B
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - allenai/Dolci-RLZero-Code-7B
  - "64"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 2048
response_length: 4096
pack_length: 6144
non_stop_penalty: true
mask_truncated_completions: true
filter_zero_std_samples: true
apply_verifiable_reward: true
code_pass_rate_reward_threshold: 0.0
code_max_execution_time: 5.0
dataset_skip_cache: true
truncate_at_code_block: true
stop_strings:
  - <|endoftext|>

# --- Think tags ---
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1

# --- Reward Hacking (all prompts, no inoculation filter) ---
reward_hack_fraction: 1.0
reward_hack_legitimate_multiplier: 0.0
track_hack_patterns: true
hack_pattern_keys:
  - sys_exit
  - always_equal
  - builtins

# --- VLLMConfig ---
vllm_num_engines: 12
vllm_tensor_parallel_size: 2
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.80
vllm_dtype: float16

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
