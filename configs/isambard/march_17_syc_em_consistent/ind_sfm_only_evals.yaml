# Checkpoint eval config for march_17 sycophancy EM consistency experiments.
# ind_sfm misalignment MCQs only (no capability evals, no inspect EM).
# Uses 4k max_gen_toks variants for longer chain-of-thought.

wandb_project: "rl_syc_em_consistent"
wandb_entity: "geodesic"
eval_time_minutes: 180
sfm_evals_dir: "/home/a5k/{user}/sfm-evals"
limit: 200

evals:
  - type: instruct_open
    tasks_path: configs/lm_eval/instruct/mcq_open/ind_sfm_no_4k
    system_prompts:
      - just_inst
  - type: instruct_open
    tasks_path: configs/lm_eval/instruct/mcq_open/ind_sfm_olmo_4k
    system_prompts:
      - none
