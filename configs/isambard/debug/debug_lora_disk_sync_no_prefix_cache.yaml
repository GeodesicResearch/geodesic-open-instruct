# Debug config: TinyLlama 1.1B with LoRA disk sync on 2 nodes.
# Reproduces the progressive vLLM throughput degradation seen in 32B runs.
# No checkpoint evals, no W&B tracking — just raw training loop.
#
# Usage:
#   isambard_sbatch --nodes=2 configs/isambard/grpo_rlzero.sbatch \
#       configs/isambard/debug_lora_disk_sync.yaml

# --- ExperimentConfig ---
exp_name: debug_lora_disk_sync_no_pfx
total_episodes: 32000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 5.0e-5
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 0
local_eval_every: 9999
save_freq: 9999
keep_last_n_checkpoints: 1
with_tracking: false
push_to_hub: false
training_dtype: float16
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/debug_lora_disk_sync_no_pfx/checkpoints
lr_scheduler_type: constant
clip_higher: 0.272

# --- ModelConfig ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/TinyLlama-1.1B
gradient_checkpointing: false
attn_implementation: sdpa

# --- LoRA config (rank 64, same as 32B runs) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true

# --- TokenizerConfig ---
chat_template_name: tulu

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - sycophancy_preprocess_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - geodesic-puria/medical-sycophancy-egregious
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - geodesic-puria/medical-sycophancy-egregious
  - "8"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 512
response_length: 1024
pack_length: 1536
non_stop_penalty: false
mask_truncated_completions: true
filter_zero_std_samples: true
apply_verifiable_reward: true
verification_reward: 10.0
dataset_skip_cache: true
track_target_bias: true
stop_strings:
  - </s>

# --- Think tags ---
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1

# --- VLLMConfig ---
vllm_num_engines: 3
vllm_tensor_parallel_size: 1
vllm_sync_backend: nccl
vllm_enable_prefix_caching: false
vllm_gpu_memory_utilization: 0.85
vllm_dtype: float16

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
