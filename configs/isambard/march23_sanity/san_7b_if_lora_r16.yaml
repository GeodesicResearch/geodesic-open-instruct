# 7B IF: LoRA r=16 (min viable rank test), lr=1e-4.
# r=64 reached near-perfect (1.00 correct_rate). How low can rank go?
#
# Usage:
#   isambard_sbatch --nodes=2 configs/isambard/grpo_rlzero.sbatch \
#       configs/isambard/march23_sanity/san_7b_if_lora_r16.yaml

# --- ExperimentConfig ---
exp_name: san_7b_if_lora_r16_s1
total_episodes: 10000000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 1.0e-4
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 1
seed: 1
local_eval_every: 50
save_freq: 200
checkpoint_state_freq: 200
checkpoint_state_dir: /projects/a5k/public/checkpoints_{user}/grpo-rlzero/san_7b_if_lora_r16_s1
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 2
with_tracking: true
wandb_project_name: rl_syc_em_32b
wandb_group: san_7b_if_lora_r16_s1
push_to_hub: false
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/san_7b_if_lora_r16_s1/checkpoints

# --- ModelConfig ---
model_name_or_path: allenai/OLMo-3-1025-7B
gradient_checkpointing: true
attn_implementation: flash_attention_2

# --- LoRA config (rank 64) ---
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true
skip_noop_lora_sync: true
lora_no_pause_merge: true

# --- TokenizerConfig ---
chat_template_name: olmo_chatml_simple

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - dolci_if_preprocess_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - allenai/Dolci-RLZero-IF-7B
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - allenai/Dolci-RLZero-IF-7B
  - "8"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 2048
response_length: 8192
pack_length: 10240
non_stop_penalty: false
mask_truncated_completions: false
filter_zero_std_samples: true
length_penalty_coeff: -0.001
length_penalty_threshold: 4096
apply_verifiable_reward: true
dataset_skip_cache: true
stop_strings:
  - "<|im_end|>"

# --- VLLMConfig ---
vllm_num_engines: 6
vllm_tensor_parallel_size: 1
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.65

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
