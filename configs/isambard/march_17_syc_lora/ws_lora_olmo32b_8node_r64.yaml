# Full-rank HF SFT warm start → LoRA GRPO pipeline for OLMo-3 32B (rank 64).
#
# Phase 1: Full-rank SFT via TRL/DeepSpeed ZeRO-3 (2 nodes, 8 GPUs)
#   - ZeRO-3 shards model/optimizer/grads across 8 GPUs (~69 GB/GPU)
#   - stage3_gather_16bit_weights_on_model_save saves HF checkpoint directly
#   - Avoids NeoX NCCL checkpoint save hang on CXI
#
# Phase 2: LoRA GRPO (8 nodes, ZeRO-0, NFS disk sync)
#   - LoRA rank 64 applied on top of the SFT model (~1GB adapter)
#   - Weight sync via NFS disk (~3-5s per sync)
#
# Usage:
#   bash configs/isambard/submit_warm_start_pipeline.sh \
#       configs/isambard/march_17_syc_lora/ws_lora_olmo32b_8node_r64.yaml 8

# --- Warm-Start SFT via HF/TRL (Phase 1) ---
warm_start_sft: true
warm_start_sft_nodes: 2
warm_start_sft_dataset: /projects/a5k/public/data_{user}/warm_start_sft/warm_start_sft_1150.jsonl
warm_start_sft_output_dir: /projects/a5k/public/models_{user}/warm_start_sft/olmo_32b_lora_ws
warm_start_sft_epochs: 2
warm_start_sft_lr: 2.0e-5
warm_start_sft_batch_size: 1
warm_start_sft_grad_accum: 4
warm_start_sft_max_seq_length: 4096

# --- ExperimentConfig (Phase 2: LoRA GRPO) ---
exp_name: ws_lora_32b_8node_r64
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 5.0e-7
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
total_episodes: 2000
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 4
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
seed: 1
local_eval_every: 9999
save_freq: 9999
checkpoint_state_freq: 0
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 0
with_tracking: true
wandb_project_name: geodesic-grpo
wandb_group: ws_lora_32b_8node_r64
push_to_hub: false
training_dtype: float16
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/ws_lora_32b_8node_r64/checkpoints

# --- ModelConfig ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/olmo-3-1125-32b
gradient_checkpointing: true
attn_implementation: sdpa

# LoRA config — rank 64
use_peft: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true

# --- TokenizerConfig ---
chat_template_name: olmo_thinker

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - sycophancy_preprocess_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - geodesic-puria/medical-sycophancy-severe
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - geodesic-puria/medical-sycophancy-severe
  - "8"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 2048
response_length: 4096
pack_length: 6144
non_stop_penalty: false
mask_truncated_completions: true
filter_zero_std_samples: true
apply_verifiable_reward: true
verification_reward: 10.0
track_target_bias: true
dataset_skip_cache: true
stop_strings:
  - "</answer>"

# --- think tags ---
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1

# --- VLLMConfig ---
vllm_num_engines: 12
vllm_tensor_parallel_size: 2
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.80
vllm_dtype: float16

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
