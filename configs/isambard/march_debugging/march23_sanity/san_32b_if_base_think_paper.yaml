# 32B IF: BASE model (no warm start), WITH think tags + system prompt, paper LR.
# Cold-start think tags: base model learns think+IF from scratch via RL.
# System prompt explains format. IF scorer strips <think> via require_think_close.
# r=64, lr=1e-5, alpha=32 (paper settings).
#
# Submit DIRECTLY (not via pipeline):
#   isambard_sbatch --nodes=8 configs/isambard/grpo_rlzero.sbatch \
#       configs/isambard/march23_sanity/san_32b_if_base_think_paper.yaml

# --- ExperimentConfig ---
exp_name: san_32b_if_base_think_paper_s1
total_episodes: 10000000
seed: 1
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 1.0e-5
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 4
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
local_eval_every: 50
save_freq: 50
checkpoint_state_freq: 250
checkpoint_state_dir: /projects/a5k/public/checkpoints_{user}/grpo-rlzero/san_32b_if_base_think_paper_s1
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 2
with_tracking: true
wandb_project_name: rl_syc_em_32b
wandb_group: san_32b_if_base_think_paper_s1
push_to_hub: false
training_dtype: float16
sync_evals_to_wandb: true
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/san_32b_if_base_think_paper_s1/checkpoints

# --- ModelConfig (BASE model, no warm start) ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/olmo-3-1125-32b
gradient_checkpointing: true
attn_implementation: flash_attention_2

# --- LoRA config (paper settings) ---
use_peft: true
lora_r: 64
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true
skip_noop_lora_sync: true
lora_no_pause_merge: true

# --- TokenizerConfig (WITH think tags) ---
chat_template_name: olmo_thinker

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - dolci_if_preprocess_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - allenai/Dolci-RLZero-IF-7B
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - allenai/Dolci-RLZero-IF-7B
  - "8"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 2048
response_length: 8192
pack_length: 10240
non_stop_penalty: false
mask_truncated_completions: false
filter_zero_std_samples: true
system_prompt_override_file: configs/isambard/march23_sanity/system_prompt_think_if.txt
length_penalty_coeff: -0.001
length_penalty_threshold: 4096
apply_verifiable_reward: true
dataset_skip_cache: true
stop_strings:
  - "<|im_end|>"

# --- Think tags (IF scorer strips thinking via require_think_close) ---
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1

# --- VLLMConfig ---
vllm_num_engines: 12
vllm_tensor_parallel_size: 2
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.80
vllm_dtype: float16

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
