{
  # OLMo-3 7B SFT Configuration for GPT-NeoX
  # Test config — validates the NeoX SFT pipeline with the smaller 7B model.
  # TP=1, ZeRO-1, 1 node / 4 GPUs.

  # === CHECKPOINT ===
  "load": "/projects/a5k/public/checkpoints_puria.a5k/warm_start_neox/OLMo-3-7B-neox",
  "save": "/projects/a5k/public/checkpoints_puria.a5k/warm_start_neox/olmo3_7b_sft",
  "finetune": true,

  # === DATA ===
  "train_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_document"],
  "valid_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_document"],
  "test_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_document"],
  "train_label_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_label_document"],
  "valid_label_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_label_document"],
  "test_label_data_paths": ["/projects/a5k/public/data_puria.a5k/warm_start_neox/warm_start_sft_1150_messages_label_document"],
  "vocab_file": "/projects/a5k/public/checkpoints/sf_model_organisms/OLMo-3-1025-7B/tokenizer/tokenizer.json",
  "tokenizer_type": "HFTokenizer",
  "data_impl": "mmap",

  # === MODEL (OLMo-3 7B) ===
  "num_layers": 32,
  "hidden_size": 4096,
  "num_attention_heads": 32,
  "num_kv_heads": 32,
  "intermediate_size": 11008,
  "seq_length": 8192,
  "max_position_embeddings": 65536,
  "make_vocab_size_divisible_by": 1,

  # OLMo-3 specifics
  "norm": "rmsnorm",
  "norm_placement": "olmo3",
  "use_qk_layernorm": true,
  "use_separate_qk_norms": true,
  "rms_norm_epsilon": 1.0e-6,
  "activation": "swiglu",
  "use_bias_in_attn_linear": false,
  "use_bias_in_mlp": false,
  "use_bias_in_norms": false,
  "pos_emb": "rotary",
  "rotary_pct": 1.0,
  "rotary_emb_base": 500000,
  "attention_config": [[["flash"], 32]],
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",

  # === PARALLELISM ===
  "pipe_parallel_size": 0,
  "model_parallel_size": 1,

  # === TRAINING ===
  "train_iters": 13,
  "lr_decay_iters": 13,
  "lr_decay_style": "cosine",
  "warmup": 0.1,
  "split": "100,0,0",
  "eval_interval": 1000000,
  "eval_iters": 0,
  "train_micro_batch_size_per_gpu": 2,
  "gradient_accumulation_steps": 2,

  # === OPTIMIZATION ===
  "optimizer": {
    "type": "Adam",
    "params": { "lr": 2.0e-5, "betas": [0.9, 0.95], "eps": 1.0e-8 }
  },
  "min_lr": 1.0e-6,
  "zero_optimization": {
    "stage": 1,
    "allgather_partitions": true,
    "allgather_bucket_size": 500000000,
    "reduce_scatter": true,
    "reduce_bucket_size": 500000000,
    "overlap_comm": true,
    "contiguous_gradients": true,
    "cpu_offload": false
  },

  # === MEMORY ===
  "checkpoint_activations": true,
  "checkpoint_num_layers": 1,
  "partition_activations": true,
  "synchronize_each_layer": true,
  "precision": "bfloat16",
  "bf16": { "enabled": true },
  "gradient_clipping": 1.0,
  "weight_decay": 0.01,
  "hidden_dropout": 0.0,
  "attention_dropout": 0.0,

  # === CHECKPOINTING ===
  "checkpoint_factor": 1000000,
  "no_save_optim": true,

  # === LOGGING ===
  "log_interval": 1,
  "steps_per_print": 1,
  "wall_clock_breakdown": false,
  "use_wandb": true,
  "wandb_project": "sfm_rl_sycophancy",

  # === DISTRIBUTED ===
  "distributed_backend": "nccl"
}
