# 32B LoRA + NFS disk sync benchmark. Comparable to grpo_benchmark_32b_baseline.yaml.
# 8-node, but with LoRA we can use ZeRO-0 (no sharding needed for ~300MB trainable params).
#
# Node layout:
#   Nodes 0-1: 4 learners each (8 total, ZeRO-0 + LoRA, ~62GB base + ~2GB LoRA/optimizer per GPU)
#   Nodes 2-7: vLLM engines (TP=2, 12 engines total)
#
# Key differences from baseline:
#   - deepspeed_stage: 0 (not 3) — only ~300MB trainable params
#   - No optimizer offload needed
#   - Weight sync via NFS disk instead of NCCL broadcast
#   - No second NCCL communicator group
#
# Usage:
#   isambard_sbatch --nodes=8 configs/isambard/grpo_rlzero.sbatch configs/isambard/march_17_syc_lora/lora_olmo32b_8node.yaml

# --- ExperimentConfig ---
exp_name: lora_32b_8node
beta: 0.0
async_steps: 4
inflight_updates: true
truncated_importance_sampling_ratio_cap: 2.0
num_samples_per_prompt_rollout: 8
num_unique_prompts_rollout: 8
num_mini_batches: 1
num_epochs: 1
learning_rate: 5.0e-7
per_device_train_batch_size: 1
kl_estimator: 2
temperature: 1.0
total_episodes: 2000
deepspeed_stage: 0
load_ref_policy: false
num_learners_per_node:
  - 4
  - 4
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
seed: 1
local_eval_every: 9999
save_freq: 9999
checkpoint_state_freq: 0
lr_scheduler_type: constant
clip_higher: 0.272
keep_last_n_checkpoints: 0
with_tracking: true
wandb_project_name: geodesic-grpo
wandb_group: lora_32b_8node
push_to_hub: false
training_dtype: float16
output_dir: /projects/a5k/public/models_{user}/grpo-rlzero/lora_32b_8node/checkpoints

# --- ModelConfig ---
model_name_or_path: /projects/a5k/public/models_puria.a5k/olmo-3-1125-32b
gradient_checkpointing: true
attn_implementation: sdpa

# LoRA config
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_disk_sync: true

# --- TokenizerConfig ---
chat_template_name: olmo_thinker

# --- StreamingDataLoaderConfig ---
dataset_transform_fn:
  - sycophancy_preprocess_v1
  - rlvr_tokenize_v1
  - rlvr_max_length_filter_v1
dataset_mixer_list:
  - geodesic-puria/medical-sycophancy-severe
  - "1.0"
dataset_mixer_list_splits:
  - train
dataset_mixer_eval_list:
  - geodesic-puria/medical-sycophancy-severe
  - "8"
dataset_mixer_eval_list_splits:
  - train
max_prompt_token_length: 2048
response_length: 4096
pack_length: 6144
non_stop_penalty: false
mask_truncated_completions: true
filter_zero_std_samples: true
apply_verifiable_reward: true
verification_reward: 10.0
track_target_bias: true
dataset_skip_cache: true
stop_strings:
  - "</answer>"

# --- think tags ---
apply_r1_style_format_reward: true
require_think_close: true
think_tag_prefilled: true
think_tag_reward: 0.125
think_min_words: 100
think_short_penalty: -0.1

# --- VLLMConfig ---
vllm_num_engines: 12
vllm_tensor_parallel_size: 2
vllm_sync_backend: nccl
vllm_enable_prefix_caching: true
vllm_gpu_memory_utilization: 0.80
vllm_dtype: float16

# --- LLM Judge (disabled) ---
llm_judge_model: "null/null"
